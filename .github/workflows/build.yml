name: Build LeftPanVib Release

on:
  push:
    paths:
      - 'leftPan_vib.m'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Standard Version (LeftPanVib.dylib)
      run: |
        clang -dynamiclib -fobjc-arc -Os -fvisibility=hidden \
        -Wl,-x -Wl,-S \
        -target arm64-apple-ios14.0 \
        -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
        -framework Foundation -framework UIKit \
        -o LeftPanVib.dylib leftPan_vib.m

    - name: Build Silent Version (LeftPanWithoutVib.dylib)
      run: |
        clang -dynamiclib -fobjc-arc -Os -fvisibility=hidden \
        -Wl,-x -Wl,-S \
        -DDISABLE_VIBRATION \
        -target arm64-apple-ios14.0 \
        -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
        -framework Foundation -framework UIKit \
        -o LeftPanWithoutVib.dylib leftPan_vib.m

    - name: Package Artifacts
      run: |
        zip LeftPan_Release_Package.zip LeftPanVib.dylib LeftPanWithoutVib.dylib

    - name: Upload Release Package
      uses: actions/upload-artifact@v4
      with:
        name: LeftPan_Release_Package
        path: LeftPan_Release_Package.zip
        retention-days: 90
