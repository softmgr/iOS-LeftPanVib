name: Build Dylib

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile (Release Mode)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -shared -fobjc-arc \
            -Os -fvisibility=hidden \
            -target arm64-apple-ios14.0 \
            -miphoneos-version-min=14.0 \
            -install_name @rpath/LeftPanVib.dylib \
            -framework UIKit -framework Foundation \
            leftPan_vib.m -o LeftPanVib.dylib
          codesign -f -s - LeftPanVib.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeftPanVib
          path: LeftPanVib.dylib
